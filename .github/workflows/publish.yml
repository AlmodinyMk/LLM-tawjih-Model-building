name: publish to PyPI
# Runs when a release is published on GitHub (or by hand from the Actions
# tab). It uses PyPI's trusted publishing: no token is stored anywhere. Set
# it up once on https://pypi.org/manage/account/publishing/ with
#   project: tawjih, owner: AlmodinyMk, repository: LLM-tawjih-Model-building,
#   workflow: publish.yml, environment: pypi
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests
      - name: build
        run: |
          cp SPEC.md tawjihlib/SPEC.md
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build
          python -m twine check dist/*
      - name: the version matches the release tag
        if: github.event_name == 'release'
        run: |
          v=$(python -c "import tawjihlib; print(tawjihlib.__version__)")
          test "v$v" = "${{ github.event.release.tag_name }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
