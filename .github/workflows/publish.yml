name: publish to PyPI
# Runs when a release is published on GitHub (or by hand from the Actions
# tab). It uses PyPI's trusted publishing: no token is stored anywhere. The
# build tools are installed from hashes, and on a release the built files
# are signed with Sigstore and the signatures attached to the release. Set
# it up once on https://pypi.org/manage/account/publishing/ with
#   project: tawjih, owner: AlmodinyMk, repository: LLM-tawjih-Model-building,
#   workflow: publish.yml, environment: pypi
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests
      - name: build
        run: |
          cp SPEC.md tawjihlib/SPEC.md
          python -m pip install --require-hashes -r .github/build-requirements.txt
          python -m build --no-isolation
          python -m twine check dist/*
      - name: the version matches the release tag
        if: github.event_name == 'release'
        run: |
          v=$(python -c "import tawjihlib; print(tawjihlib.__version__)")
          test "v$v" = "${{ github.event.release.tag_name }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  sign:
    # Sigstore signs with this workflow's identity (no key is kept); the
    # files and their .sigstore.json bundles are attached to the release.
    # Check one with:
    #   python -m sigstore verify github FILE --repository \
    #     AlmodinyMk/LLM-tawjih-Model-building
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl
