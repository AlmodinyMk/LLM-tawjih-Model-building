name: Auto Contributors

on:
  issues:
    types: [opened]
  pull_request:
    types: [closed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  contributors:
    if: github.event_name == 'issues' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: JoshuaKGoldberg/all-contributors-auto-action@v0.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
